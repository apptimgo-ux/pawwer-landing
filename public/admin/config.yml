backend:
  name: github
  repo: apptimgo-ux/pawwer-landing
  branch: main
  base_url: https://www.pawwerapp.com
  auth_endpoint: api/oauth

site_url: https://www.pawwerapp.com
media_folder: "public/img"
public_folder: "/img"
locale: es
publish_mode: editorial_workflow
editor:
  preview: true

collections:
  - name: ajustes
    label: "Ajustes generales"
    delete: false
    files:
      - name: settings
        label: "Contacto, precios e imagen para redes"
        file: "content/settings.json"
        fields:
          - name: media
            label: "Imagen para compartir en redes"
            widget: object
            fields:
              - { name: ogImage, label: "Imagen Open Graph (1200×630)", widget: image, required: false }
          - name: contact
            label: "Contacto"
            widget: object
            fields:
              - { name: email, label: "Correo", widget: string }
              - { name: phoneLabel, label: "Teléfono (como se muestra)", widget: string }
              - { name: phoneHref, label: "Teléfono (enlace, tel:+52...)", widget: string }
              - { name: addressLine1, label: "Dirección · línea 1", widget: string }
              - { name: addressLine2, label: "Dirección · línea 2", widget: string }
              - { name: crmUrl, label: "URL del CRM (botón Sign in)", widget: string }
          - name: prices
            label: "Precios (MXN, con símbolo, ej. $1,490)"
            widget: object
            fields:
              - { name: esencial, label: "Esencial", widget: string }
              - { name: crecimiento, label: "Crecimiento", widget: string }
              - { name: escala, label: "Escala", widget: string }
          - name: checkout
            label: "Enlaces de pago (Stripe / Mercado Pago). Vacío = inicia la prueba en el CRM"
            widget: object
            fields:
              - { name: esencial, label: "Esencial", widget: string, required: false }
              - { name: crecimiento, label: "Crecimiento", widget: string, required: false }
              - { name: escala, label: "Escala", widget: string, required: false }
          - name: privacyReview
            label: "Fecha de revisión de la política de privacidad"
            widget: object
            fields:
              - { name: es, label: "Español", widget: string }
              - { name: en, label: "Inglés", widget: string }

  - name: contenido_es
    label: "Contenido · Español"
    delete: false
    files:
      - name: es
        label: "Página en español"
        file: "content/es.json"
        fields: &page_fields
          - { name: htmlLang, widget: hidden }
          - { name: ogLocale, widget: hidden }
          - name: meta
            label: "SEO (título y descripción)"
            widget: object
            collapsed: true
            fields:
              - { name: title, label: "Título", widget: string }
              - { name: description, label: "Descripción", widget: text }
          - name: nav
            label: "Menú"
            widget: object
            collapsed: true
            fields:
              - { name: skip, label: "Saltar al contenido", widget: string }
              - name: links
                label: "Enlaces del menú"
                widget: list
                fields:
                  - { name: label, label: "Texto", widget: string }
                  - { name: hash, label: "Ancla (#soluciones…)", widget: string }
              - { name: login, label: "Botón Sign in", widget: string }
              - { name: menuOpen, label: "Abrir menú (accesibilidad)", widget: string }
              - { name: menuClose, label: "Cerrar menú (accesibilidad)", widget: string }
              - { name: langLabel, label: "Etiqueta del botón de idioma", widget: string }
              - { name: langAria, label: "Descripción del botón de idioma", widget: string }
          - name: footer
            label: "Pie de página"
            widget: object
            collapsed: true
            fields:
              - { name: privacy, label: "Texto del enlace de privacidad", widget: string }
              - { name: privacyHref, label: "Ruta de la política", widget: string }
              - { name: rights, label: "Texto de derechos", widget: string }
          - name: plans
            label: "Planes (el precio se edita en Ajustes)"
            widget: list
            collapsed: true
            fields:
              - { name: slug, label: "Identificador interno (esencial / crecimiento / escala — no cambiar)", widget: string }
              - { name: name, label: "Nombre visible (ES: Esencial… · EN: Essential…)", widget: string }
              - { name: summary, label: "Resumen", widget: string }
              - { name: inherits, label: "Texto 'incluye…'", widget: string }
              - name: features
                label: "Características"
                widget: list
                fields:
                  - { name: text, label: "Característica", widget: string }
              - { name: note, label: "Nota 'En activación' (opcional)", widget: text, required: false }
          - name: comparison
            label: "Tabla comparativa"
            widget: list
            collapsed: true
            fields:
              - { name: label, label: "Característica", widget: string }
              - { name: esencial, label: "Esencial", widget: string }
              - { name: crecimiento, label: "Crecimiento", widget: string }
              - { name: escala, label: "Escala", widget: string }
          - name: planDetail
            label: "Páginas de cada plan"
            widget: object
            collapsed: true
            fields:
              - { name: back, label: "Enlace 'volver'", widget: string }
              - { name: includesTitle, label: "Título 'qué incluye'", widget: string }
              - { name: inheritsLabel, label: "Texto 'incluye lo del plan anterior'", widget: string }
              - { name: trialTitle, label: "Título 'cómo funciona la prueba'", widget: string }
              - name: trialLines
                label: "Cómo funciona la prueba (viñetas)"
                widget: list
                fields:
                  - { name: text, label: "Viñeta", widget: text }
              - { name: activationTitle, label: "Título 'en activación'", widget: string }
              - { name: exclusionsTitle, label: "Título 'qué no cubre'", widget: string }
              - { name: ctaTrial, label: "Botón · prueba", widget: string }
              - { name: ctaCheckout, label: "Botón · pago", widget: string }
              - { name: ctaSales, label: "Enlace · ventas", widget: string }
              - { name: priceUnit, label: "Unidad de precio", widget: string }
          - name: blocks
            label: "Bloques de la página (arrastra para reordenar)"
            label_singular: "bloque"
            widget: list
            types:
              - name: hero
                label: "Hero (portada)"
                widget: object
                summary: "Hero · {{fields.h1a}} {{fields.h1b}}"
                fields:
                  - { name: anchor, label: "Ancla opcional", widget: string, required: false }
                  - { name: kicker, label: "Texto pequeño de arriba", widget: string }
                  - { name: h1a, label: "Titular · línea 1", widget: string }
                  - { name: h1b, label: "Titular · línea 2", widget: string }
                  - { name: sub, label: "Frase de apoyo", widget: text }
                  - { name: ctaPrimary, label: "Botón principal", widget: string }
                  - { name: ctaSecondary, label: "Enlace secundario", widget: string, required: false }
                  - { name: metaLeft, label: "Pie · izquierda", widget: string }
                  - { name: metaRight, label: "Pie · derecha", widget: string }
                  - { name: mediaType, label: "Medio", widget: select, options: ["none", "image", "video"], default: "none" }
                  - name: slides
                    label: "Carrusel de imágenes (solo cuando Medio = image)"
                    widget: list
                    required: false
                    fields:
                      - { name: image, label: "Fotografía", widget: image }
                      - { name: alt, label: "Descripción", widget: string, required: false }
                  - { name: image, label: "Imagen alternativa", widget: image, required: false }
                  - { name: video, label: "Video mp4 (si Medio = video)", widget: file, required: false }
                  - { name: poster, label: "Imagen de portada del video", widget: image, required: false }
                  - { name: mediaPlacement, label: "¿Dónde aparece?", widget: select, options: [{ label: "Debajo del texto", value: "below" }, { label: "De fondo, detrás del texto", value: "background" }], default: "below", required: false }
                  - { name: focalX, label: "Encuadre horizontal (0 izquierda · 100 derecha)", widget: number, value_type: int, min: 0, max: 100, default: 50, required: false }
                  - { name: focalY, label: "Encuadre vertical (0 arriba · 100 abajo)", widget: number, value_type: int, min: 0, max: 100, default: 50, required: false }
                  - { name: overlay, label: "Oscurecer fondo (0 a 85 %)", widget: number, value_type: int, min: 0, max: 85, default: 45, required: false }
                  - { name: mediaHeight, label: "Altura de imagen/video o portada (320 a 1000 px)", widget: number, value_type: int, min: 320, max: 1000, default: 640, required: false }
                  - { name: mediaFit, label: "Ajuste de la imagen o video", widget: select, options: [{ label: "Llenar el espacio (recorta bordes)", value: "cover" }, { label: "Mostrar completo (puede dejar márgenes)", value: "contain" }], default: "cover", required: false }
                  - { name: textTone, label: "Color del texto sobre el fondo", widget: select, options: [{ label: "Claro", value: "light" }, { label: "Oscuro", value: "dark" }], default: "light", required: false }
                  - { name: imageAlt, label: "Descripción de la imagen para accesibilidad", widget: string, required: false }
              - name: statement
                label: "Frase destacada"
                widget: object
                summary: "Frase · {{fields.h2a}} {{fields.h2b}}"
                fields:
                  - { name: anchor, label: "Ancla opcional", widget: string, required: false }
                  - { name: label, label: "Etiqueta", widget: string }
                  - { name: h2a, label: "Titular · línea 1", widget: string }
                  - { name: h2b, label: "Titular · línea 2", widget: string }
                  - { name: body, label: "Párrafo", widget: text }
                  - { name: image, label: "Imagen del CRM", widget: image, required: false }
                  - { name: imageAlt, label: "Descripción de la imagen", widget: string, required: false }
              - name: process
                label: "Proceso (fases)"
                widget: object
                summary: "Proceso · {{fields.h2a}} {{fields.h2b}}"
                fields:
                  - { name: anchor, label: "Ancla opcional (por defecto: soluciones)", widget: string, required: false }
                  - { name: label, label: "Etiqueta", widget: string }
                  - { name: h2a, label: "Titular · línea 1", widget: string }
                  - { name: h2b, label: "Titular · línea 2", widget: string }
                  - name: phases
                    label: "Fases"
                    widget: list
                    fields:
                      - { name: name, label: "Nombre", widget: string }
                      - { name: line, label: "Descripción", widget: text }
              - name: pillars
                label: "Características (3 columnas)"
                widget: object
                summary: "Características · {{fields.h2a}} {{fields.h2b}}"
                fields:
                  - { name: anchor, label: "Ancla opcional", widget: string, required: false }
                  - { name: eyebrow, label: "Etiqueta", widget: string }
                  - { name: h2a, label: "Titular · línea 1", widget: string }
                  - { name: h2b, label: "Titular · línea 2", widget: string }
                  - name: items
                    label: "Columnas"
                    widget: list
                    fields:
                      - { name: icon, label: "Icono", widget: select, required: false, options: ["chat", "calendar", "chart", "target", "users", "spark", "zap", "compass", "layers", "shield"] }
                      - { name: h3, label: "Título", widget: string }
                      - { name: p, label: "Texto", widget: text }
              - name: showcase
                label: "Vista del producto"
                widget: object
                summary: "Vista del producto · {{fields.h2}}"
                fields:
                  - { name: anchor, label: "Ancla opcional", widget: string, required: false }
                  - { name: eyebrow, label: "Etiqueta", widget: string }
                  - { name: h2, label: "Titular", widget: string }
                  - { name: body, label: "Texto", widget: text }
                  - { name: image, label: "Screenshot real (si lo subes, reemplaza la maqueta)", widget: image, required: false }
                  - name: mock
                    label: "Maqueta dibujada (se usa si no subes screenshot)"
                    widget: object
                    collapsed: true
                    fields:
                      - { name: bar, label: "Barra superior", widget: string }
                      - { name: eyebrow, label: "Fecha/hora", widget: string }
                      - { name: h3, label: "Título", widget: string }
                      - name: leads
                        label: "Tarjetas de ejemplo"
                        widget: list
                        fields:
                          - { name: stage, label: "Etapa", widget: string }
                          - { name: initials, label: "Iniciales", widget: string }
                          - { name: name, label: "Nombre", widget: string }
                          - { name: role, label: "Detalle", widget: string }
                          - { name: status, label: "Estado", widget: string }
                      - { name: context, label: "Franja de contexto", widget: string }
                      - { name: caption, label: "Pie", widget: string }
              - name: benefits
                label: "Beneficios (3 columnas)"
                widget: object
                summary: "Beneficios · {{fields.h2a}} {{fields.h2b}}"
                fields:
                  - { name: anchor, label: "Ancla opcional (por defecto: beneficios)", widget: string, required: false }
                  - { name: eyebrow, label: "Etiqueta", widget: string }
                  - { name: h2a, label: "Titular · línea 1", widget: string }
                  - { name: h2b, label: "Titular · línea 2", widget: string }
                  - name: items
                    label: "Columnas"
                    widget: list
                    fields:
                      - { name: icon, label: "Icono", widget: select, required: false, options: ["chat", "calendar", "chart", "target", "users", "spark", "zap", "compass", "layers", "shield"] }
                      - { name: h3, label: "Título", widget: string }
                      - { name: p, label: "Texto", widget: text }
              - name: logos
                label: "Logos / Confían en nosotros"
                widget: object
                summary: "Logos ({{fields.items.length}})"
                fields:
                  - { name: anchor, label: "Ancla opcional", widget: string, required: false }
                  - { name: eyebrow, label: "Etiqueta (opcional)", widget: string, required: false }
                  - { name: title, label: "Título (opcional)", widget: string, required: false }
                  - name: items
                    label: "Logos"
                    label_singular: "logo"
                    widget: list
                    fields:
                      - { name: image, label: "Imagen del logo (PNG/SVG)", widget: image }
                      - { name: alt, label: "Nombre (texto alternativo)", widget: string }
                      - { name: url, label: "Enlace (opcional)", widget: string, required: false }
              - name: pricing
                label: "Paquetes / precios"
                widget: object
                summary: "Paquetes · {{fields.h2a}} {{fields.h2b}}"
                fields:
                  - { name: anchor, label: "Ancla opcional (por defecto: planes)", widget: string, required: false }
                  - { name: eyebrow, label: "Etiqueta", widget: string }
                  - { name: h2a, label: "Titular · línea 1", widget: string }
                  - { name: h2b, label: "Titular · línea 2", widget: string }
                  - { name: intro, label: "Párrafo de introducción", widget: text }
                  - { name: priceUnit, label: "Unidad de precio (MXN / mes)", widget: string }
                  - { name: mostPopular, label: "Etiqueta 'más elegido'", widget: string }
                  - { name: cta, label: "Botón de los planes", widget: string }
                  - { name: activationLabel, label: "Etiqueta 'En activación'", widget: string }
                  - { name: compareTitle, label: "Título de la tabla comparativa", widget: string }
                  - { name: compareFeatureCol, label: "Encabezado 1ª columna de la tabla", widget: string }
                  - { name: showComparison, label: "Mostrar tabla comparativa", widget: boolean, default: true }
              - name: agency
                label: "PAWWER Agencia"
                widget: object
                summary: "Agencia · {{fields.h2a}} {{fields.h2b}}"
                fields:
                  - { name: anchor, label: "Ancla opcional", widget: string, required: false }
                  - { name: eyebrow, label: "Etiqueta", widget: string }
                  - { name: h2a, label: "Titular · línea 1", widget: string }
                  - { name: h2b, label: "Titular · línea 2", widget: string }
                  - { name: body, label: "Texto", widget: text }
                  - { name: cta, label: "Botón", widget: string }
              - name: notes
                label: "Letra chica de precios"
                widget: object
                summary: "Letra chica ({{fields.items.length}})"
                fields:
                  - { name: anchor, label: "Ancla opcional", widget: string, required: false }
                  - name: items
                    label: "Notas"
                    widget: list
                    fields:
                      - { name: lead, label: "Frase en negrita (opcional)", widget: string, required: false }
                      - { name: body, label: "Texto", widget: text }
              - name: cta
                label: "Llamado final + contacto"
                widget: object
                summary: "Llamado final · {{fields.h2a}} {{fields.h2b}}"
                fields:
                  - { name: anchor, label: "Ancla opcional (por defecto: contacto)", widget: string, required: false }
                  - { name: eyebrow, label: "Etiqueta", widget: string }
                  - { name: h2a, label: "Titular · línea 1", widget: string }
                  - { name: h2b, label: "Titular · línea 2", widget: string }
                  - { name: buttonLabel, label: "Botón", widget: string }

  - name: contenido_en
    label: "Contenido · English"
    delete: false
    files:
      - name: en
        label: "English page"
        file: "content/en.json"
        fields: *page_fields
